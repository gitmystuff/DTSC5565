[project]
name = "se-agent"
version = "0.1.0"
description = "Prompt router and structured-prompt agents for CSCE 5565"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=1.7.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
